{% include base_path %}
{% if page.member_login %}<meta name="robots" content="noindex">{% endif %}
{% if jekyll.environment == "production" and site.google_analytics and page.member_login != true %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics | first | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  {% for measurement_id in site.google_analytics %}
  gtag('config', {{ measurement_id | jsonify }});
  {% endfor %}
</script>
{% endif %}
<link rel="icon" type="image/svg+xml" href="{{ '/images/angstrom-mark.svg' | relative_url }}?v=logo08">
<link rel="stylesheet" href="{{ '/assets/css/fontawesome.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/foundry.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script>try { if (!localStorage.getItem('theme')) localStorage.setItem('theme','dark'); if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme','dark'); } catch (_) { document.documentElement.setAttribute('data-theme','dark'); }</script>
