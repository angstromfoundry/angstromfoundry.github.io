---
layout: default
---
{% include base_path %}
<div id="main" role="main">
  {% include sidebar.html %}
  <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
    {% if page.title %}<meta itemprop="headline" content="{{ page.title | escape }}">{% endif %}
    <div class="page__inner-wrap">
      <header>
        {% if page.title %}<h1 class="page__title" itemprop="headline">{{ page.title }}</h1>{% endif %}
        {% if page.date %}<p class="page__date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time></p>{% endif %}
      </header>
      <section class="page__content" itemprop="text">{{ content }}</section>
      <footer class="page__meta"></footer>
    </div>
  </article>
</div>
